spring.application.name=steam.vm

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://------------------------?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=---------------------
spring.datasource.password=----------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

# validate = ????????? ????????? ??????
# none = ?????? ?? ???????
spring.jpa.hibernate.ddl-auto=validate
#server.servlet.session.timeout=10m
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false

# 32-byte Base64 key for database field encryption.
app.crypto.key-base64=${APP_CRYPTO_KEY_BASE64:--------------------------------------}
app.jwt.secret=${APP_JWT_SECRET:dev-local-jwt-secret-change-me-please-32-bytes}
app.jwt.ttl-seconds=${APP_JWT_TTL_SECONDS:---------}
app.farm-reset.zone=${APP_FARM_RESET_ZONE:---------}

# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================
# SERVER
# ===============================1

server.port=0000
server.error.include-message=always

# Keep Hibernate SQL and parameter binding out of the server console.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.orm.jdbc.extract=WARN
